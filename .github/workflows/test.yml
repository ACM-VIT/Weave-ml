name: Test Trending Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4.5-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.13.4"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --dev

    - name: Check synthetic recommendation benchmark regression gates
      run: |
        uv run python -m scripts.evaluate_recommendations \
          --bundle tests/fixtures/recommendation_benchmark/bundle.json \
          --run tests/fixtures/recommendation_benchmark/run.json \
          --baseline tests/fixtures/recommendation_benchmark/baseline.json \
          --policy tests/fixtures/recommendation_benchmark/policy.json \
          --output "$RUNNER_TEMP/recommendation-diagnostic.json"
    - name: Gate actual model stages against the fixed diagnostic baseline
      run: |
        uv run python -c 'import json, os; from pathlib import Path; snapshot=json.loads(Path("tests/fixtures/recommendation_actual_stage/snapshot.json").read_text()); (Path(os.environ["RUNNER_TEMP"])/"actual-stage-bundle.json").write_text(json.dumps(snapshot["bundle"], allow_nan=False))'
        uv run python -m scripts.run_recommendation_stages \
          --snapshot tests/fixtures/recommendation_actual_stage/snapshot.json \
          --artifact-dir inference \
          --output "$RUNNER_TEMP/actual-recommendation-stage-run.json"
        uv run python -m scripts.evaluate_recommendations \
          --bundle "$RUNNER_TEMP/actual-stage-bundle.json" \
          --run "$RUNNER_TEMP/actual-recommendation-stage-run.json" \
          --baseline tests/fixtures/recommendation_actual_stage/baseline.json \
          --policy tests/fixtures/recommendation_actual_stage/policy.json \
          --output "$RUNNER_TEMP/actual-recommendation-diagnostic.json"
    - name: Gate public-source catalogue against curated accepted-artifact metrics
      run: |
        uv run python -c 'import json, os; from pathlib import Path; snapshot=json.loads(Path("tests/fixtures/recommendation_public_catalog/snapshot.json").read_text()); (Path(os.environ["RUNNER_TEMP"])/"public-catalog-bundle.json").write_text(json.dumps(snapshot["bundle"], allow_nan=False))'
        uv run python -m scripts.run_recommendation_stages \
          --snapshot tests/fixtures/recommendation_public_catalog/snapshot.json \
          --artifact-dir inference \
          --output "$RUNNER_TEMP/public-catalog-stage-run.json"
        uv run python -m scripts.evaluate_recommendations \
          --bundle "$RUNNER_TEMP/public-catalog-bundle.json" \
          --run "$RUNNER_TEMP/public-catalog-stage-run.json" \
          --baseline tests/fixtures/recommendation_public_catalog/reference.json \
          --policy tests/fixtures/recommendation_public_catalog/policy.json \
          --output "$RUNNER_TEMP/public-catalog-diagnostic.json"
    - name: Retain actual-stage diagnostic evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: actual-recommendation-diagnostics
        if-no-files-found: ignore
        path: |
          ${{ runner.temp }}/actual-recommendation-stage-run.json
          ${{ runner.temp }}/actual-recommendation-diagnostic.json
          ${{ runner.temp }}/public-catalog-stage-run.json
          ${{ runner.temp }}/public-catalog-diagnostic.json
    - name: Check versioned ML contract drift
      run: uv run python -m scripts.export_ml_openapi --check

    - name: Set up test environment
      run: |
        echo "GITHUB_TOKEN=test_token_12345" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> $GITHUB_ENV
        echo "TEST_DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> $GITHUB_ENV

    - name: Wait for Redis and Qdrant
      run: |
        python - <<'PY'
        import socket
        import time

        deadline = time.monotonic() + 60
        pending = {("127.0.0.1", 6379), ("127.0.0.1", 6333)}
        while pending and time.monotonic() < deadline:
            for address in list(pending):
                try:
                    with socket.create_connection(address, timeout=1):
                        pending.remove(address)
                except OSError:
                    pass
            if pending:
                time.sleep(0.5)
        if pending:
            raise SystemExit(f"Services did not become ready: {sorted(pending)}")
        PY

    - name: Run deterministic tests
      env:
        GITHUB_TOKEN: test_token_12345
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        uv run pytest tests/ -m "not integration and not benchmark" -v --cov=trending --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      env:
        GITHUB_TOKEN: test_token_12345
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://127.0.0.1:6379/0
        QDRANT_URL: http://127.0.0.1:6333
        RUN_FEEDBACK_INTEGRATION: "true"
        RUN_V2_FEEDBACK_INTEGRATION: "true"
        RUN_MODEL_OPERATION_INTEGRATION: "1"
      run: |
        uv run pytest tests/ -m "integration" -v

    - name: Run performance benchmarks with base-branch regression gate
      env:
        GITHUB_TOKEN: test_token_12345
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -n "$BENCHMARK_BASE_SHA" ] && [ "$BENCHMARK_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
          git worktree add "$RUNNER_TEMP/gh-social-ml-benchmark-base" "$BENCHMARK_BASE_SHA"
        fi
        if [ -f "$RUNNER_TEMP/gh-social-ml-benchmark-base/tests/test_v2_performance.py" ]; then
          cd "$RUNNER_TEMP/gh-social-ml-benchmark-base"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest tests/test_v2_performance.py \
            -m benchmark --benchmark-only \
            --benchmark-storage="file://$GITHUB_WORKSPACE/.benchmarks" \
            --benchmark-save=base
          cd "$GITHUB_WORKSPACE"
          uv run pytest tests/test_v2_performance.py -m benchmark --benchmark-only \
            --benchmark-compare=base --benchmark-compare-fail=mean:5% \
            --benchmark-autosave
        else
          uv run pytest tests/ -m benchmark --benchmark-only --benchmark-autosave
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: .benchmarks/

    # Only trusted main pushes can populate the release cache or publish images.
    # BuildKit also hashes individual COPY/RUN inputs; source-only changes retain
    # the locked dependency, pinned model and trust-store layers (mode=max).
    - name: Set up release builder
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Prepare exact committed build context
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/release-context"
        git archive --format=tar "${{ github.sha }}" | tar -xf - -C "$RUNNER_TEMP/release-context"

    - name: Build verified release image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ runner.temp }}/release-context
        platforms: linux/amd64
        load: true
        tags: gh-social-ml:${{ github.sha }}
        build-args: ML_RELEASE_ID=${{ github.sha }}
        cache-from: type=gha,scope=release-main-amd64-${{ hashFiles('Dockerfile', '.dockerignore', 'pyproject.toml', 'uv.lock') }}
        cache-to: type=gha,mode=max,ignore-error=true,scope=release-main-amd64-${{ hashFiles('Dockerfile', '.dockerignore', 'pyproject.toml', 'uv.lock') }}

    - name: Bind release archive to verified source and immutable image digest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        docker save gh-social-ml:${{ github.sha }} | gzip > gh-social-ml.tar.gz
        python scripts/release_artifact.py create --sha "${{ github.sha }}"
        docker image inspect --format '{{.Size}}' gh-social-ml:${{ github.sha }} > deployment.image-size
        sha256sum gh-social-ml.tar.gz deployment.image-size deployment.image-id deployment.release.json \
          deploy/systemd/gh-social-ml.service deploy/systemd/gh-social-ml-feedback.service \
          scripts/validate_production_config.py scripts/production_smoke.py > deployment.sha256

    - name: Publish verified release archive
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-${{ github.sha }}-${{ github.run_attempt }}
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        path: |
          gh-social-ml.tar.gz
          deployment.image-size
          deployment.image-id
          deployment.release.json
          deployment.sha256

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
